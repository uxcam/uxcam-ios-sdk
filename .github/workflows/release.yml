name: Create Release on Main Merge

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag, release, publish to CocoaPods
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # create tag + GitHub Release
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Unzip UXCam.xcframework
        run: unzip -o UXCam.xcframework.zip -d .

      - name: Extract version
        id: version
        run: |
          raw="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" UXCam.xcframework/ios-arm64/UXCam.framework/Info.plist)"
          version="$(printf '%s' "$raw" | tr -d '[:space:]')"
          case "$version" in
            ''|*[!0-9.]*|.*|*..*|*.)
              echo "::error::Invalid version from plist: '$raw'"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Found version: $version"

      - name: Check tag exists
        id: tag_check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; tag step will be skipped."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check pod already published
        id: pod_check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if curl -fsSL "https://trunk.cocoapods.org/api/v1/pods/UXCam" \
              | grep -q "\"name\":[[:space:]]*\"$VERSION\""; then
            echo "UXCam $VERSION already on cocoapods trunk; pod push will be skipped."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to do - exit early
        if: steps.tag_check.outputs.exists == 'true' && steps.pod_check.outputs.exists == 'true'
        run: |
          echo "Tag and pod both already published. Bump version to release."
          exit 0

      - name: Verify podspec (local lint, no remote tag required)
        if: steps.tag_check.outputs.exists == 'false' || steps.pod_check.outputs.exists == 'false'
        run: pod lib lint UXCam.podspec --allow-warnings --analyze --fail-fast --verbose

      - name: Create tag and GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            --latest)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Upload to cocoapods 🚀
        if: steps.pod_check.outputs.exists == 'false'
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk push UXCam.podspec --allow-warnings

      - name: Notify Slack
        if: steps.tag_check.outputs.exists == 'false' || steps.pod_check.outputs.exists == 'false'
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        env:
          PKG_VERSION: v${{ steps.version.outputs.version }}
          RELEASE_URL: ${{ steps.release.outputs.url || format('https://github.com/{0}/releases/tag/{1}', github.repository, steps.version.outputs.version) }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-templated: true
          payload: |
            text: ":rocket: UXCam iOS SDK {{ env.PKG_VERSION }} released :rocket:"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "<!here> UXCam iOS SDK *{{ env.PKG_VERSION }}* has been released. :rocket:"
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*SDK*\niOS (native)"
                  - type: mrkdwn
                    text: "*Version*\n{{ env.PKG_VERSION }}"
              - type: section
                text:
                  type: mrkdwn
                  text: "<{{ env.RELEASE_URL }}|View release notes>"
