name: Publish to cocoapods

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to cocoapods
        type: boolean
        default: false
        required: true

permissions: {}

concurrency:
  group: publish-cocoapods-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Publish to CocoaPods
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out ${{ github.sha }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify podspec
        run: pod spec lint UXCam.podspec

      - name: Upload to cocoapods 🚀
        if: ${{ inputs.publish }}
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk push UXCam.podspec --allow-warnings
